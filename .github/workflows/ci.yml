name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Verilog tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Lint the SystemVerilog
        run: make lint
      - name: Regression (RTL vs model, cycle-exact, predictor on and off)
        run: make test
      - name: Verify the cycle equation
        run: make math
      - name: Generated docs and charts are up to date
        run: |
          make docs charts diagram arena && node tools/perf_report.mjs > /dev/null
          git diff --exit-code -- binary docs/img/pipeline docs/img/instructions docs/img/formats docs/img/charts docs/img/cpu_block_diagram.svg web/programs.js

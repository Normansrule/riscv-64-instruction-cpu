# Placement Constraints (standard cells, SRAMs)

# Source: hammer/src/hammer-vlsi/defaults.yml
# - Valid options:
#   - "r0"   (standard orientation)
#   - "r90"  (rotated 90 degrees clockwise)
#   - "r180" (rotated 180 degrees)
#   - "r270" (rotated 270 degrees clockwise; equivalent to -90 degrees counterclockwise)
#   - "mx"   (mirrored about the x-axis)
#   - "mx90" (mirrored about the x-axis, then rotated 90 degrees clockwise)
#   - "my"   (mirrored about the y-axis)
#   - "my90" (mirrored about the y-axis, then rotated 90 degrees clockwise)
# x (float) - x coordinate in um
# - Required for all types
# y (float) - y coordinate in um
# - Required for all types
# width (float) - width in um
# - Required for all types, but can be auto-filled for hierarchical and hardmacro if left blank
# height (float) - height in um
# - Required for all types, but can be auto-filled for hierarchical and hardmacro if left blank

vlsi.inputs.placement_constraints:
  - path: "riscv_top"
    type: toplevel

    # Set the floorplan margin
    margins:
      left:   30
      right:  30
      top:    30
      bottom: 30

    # Lower left corner coordinate of the top module
    x: 0
    y: 0

    # Floorplan dimensions
    width: &FP_WIDTH 3400 # Default: 3500
    height: 2000 # Default: 3500
       
    # Modify the path of the SRAMs according to your design
    # Add more hardmacro placement constraints if your design
    # uses more SRAMs
    # You can play around with different options of
    # orientations and locations to achieve good QoR
    #SRAM1RW64x32

  - path: "riscv_top/mem/icache/gen_ways[0].generate_cache_data_lanes[0].Cache_Data_Lane"
    type: hardmacro
    x: 100 # Default: 250
    y: 850 # Default: 900
    orientation: "r0"
    top_layer: met4

  - path: "riscv_top/mem/icache/gen_ways[0].generate_cache_data_lanes[1].Cache_Data_Lane"
    type: hardmacro
    x: 850 # Default: 1050
    y: 850 # Default: 900
    orientation: "my"
    top_layer: met4

  - path: "riscv_top/mem/icache/gen_ways[0].generate_cache_data_lanes[2].Cache_Data_Lane"
    type: hardmacro
    x: 100 # Default: 250
    y: 1500 # Default: 1600
    orientation: "r0"
    top_layer: met4

  - path: "riscv_top/mem/icache/gen_ways[0].generate_cache_data_lanes[3].Cache_Data_Lane"
    type: hardmacro
    x: 850 # Default: 1050
    y: 1500 # Default: 1600
    orientation: "my"
    top_layer: met4

  - path: "riscv_top/mem/dcache/gen_ways[0].generate_cache_data_lanes[0].Cache_Data_Lane"
    type: hardmacro
    x: 2000 # Default: 1850
    y: 850 # Default: 900
    orientation: "r0"
    top_layer: met4

  - path: "riscv_top/mem/dcache/gen_ways[0].generate_cache_data_lanes[1].Cache_Data_Lane"
    type: hardmacro
    x: 2800 # Default: 2650
    y: 850 # Default: 900
    orientation: "my"
    top_layer: met4

  - path: "riscv_top/mem/dcache/gen_ways[0].generate_cache_data_lanes[2].Cache_Data_Lane"
    type: hardmacro
    x: 2000 # Default: 1850
    y: 1500 # Default: 1600
    orientation: "r0"
    top_layer: met4

  - path: "riscv_top/mem/dcache/gen_ways[0].generate_cache_data_lanes[3].Cache_Data_Lane"
    type: hardmacro
    x: 2800 # Default: 2650
    y: 1500 # Default: 1600
    orientation: "my"
    top_layer: met4


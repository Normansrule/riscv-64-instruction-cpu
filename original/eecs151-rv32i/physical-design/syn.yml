# Specify Global Variables
clockPeriod: &CLK_PERIOD "9.0ns"
clockPeriodby5: &CLK_PERIOD_BY_5 "2.0" # used for pin delays, update accordingly (For 20ns 4.4ns)
verilogSrc: &VERILOG_SRC
  - "src/Opcode_pkg.sv"
  - "src/ALUop_pkg.sv"
  - "src/IMMEDIATEop_pkg.sv"
  - "src/WRITEBACK_op_pkg.sv"
  - "src/const_pkg.sv"
  - "src/ALU.sv"
  - "src/ALUdec.sv"
  - "src/Branch_Comparator.sv"
  - "src/Branch_Control_Unit.sv"
  - "src/Control_Status_Register_File.sv"
  - "src/Control_Unit.sv"
  - "src/Immediate_Generator.sv"
  - "src/Load_Control_Unit.sv"
  - "src/Register_File.sv"
  - "src/Store_Control_Unit.sv"
  - "src/Write_Control_Unit.sv"
  - "src/Riscv151.sv"
  - "src/Memory151.sv"
  - "src/ExtMemModel.sv"
  # - "src/no_cache_mem.sv"
  - "src/cache.sv"
  - "src/riscv_top.sv"
  - "src/riscv_arbiter.sv"
  - "src/antenna_stub.sv"
  - "src/GShare_Branch_Predictor.sv"

  # Add more source files here if you need


# Specify clock signals
vlsi.inputs.clocks: [
  {name: "clk", period: *CLK_PERIOD, uncertainty: "0.1ns"}
]

# Input delays match INPUT_DELAY parameter in riscv_test_harness.v
vlsi.inputs.delays: [
  {name: "mem*", clock: "clk", direction: "input", delay: *CLK_PERIOD_BY_5}
]

# Synthesis Constraints
synthesis.inputs:
  top_module: "riscv_top"
  input_files: *VERILOG_SRC

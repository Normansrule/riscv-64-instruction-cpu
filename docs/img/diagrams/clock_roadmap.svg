<text x="456" y="135" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8A968E" text-anchor="end">64 subtract steps in one cycle</text>
<text x="456" y="166" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#17251D" text-anchor="end">performance, SkyWater 130 nm</text>

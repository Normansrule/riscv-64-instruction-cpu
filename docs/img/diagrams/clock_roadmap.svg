<text x="640.1289464900951" y="304" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C2185B" text-anchor="start">400 ps  =  2.50 GHz</text>
<text x="456" y="319" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8A968E" text-anchor="end">needs 1.3x less logic per stage</text>
<text x="456" y="350" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#17251D" text-anchor="end">target: 5 GHz</text>

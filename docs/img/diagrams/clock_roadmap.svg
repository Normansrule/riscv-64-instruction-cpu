<text x="36" y="432" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17251D" text-anchor="start">Closing the gap: the clock is set by the slowest pipeline stage, so every step cuts the logic between two registers</text>
<rect x="36" y="445" width="84" height="18" rx="9" fill="#27AE60" fill-opacity="0.13" stroke="#27AE60"/>
<text x="78" y="457" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#27AE60" text-anchor="middle">done</text>
<text x="134" y="458" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Prefix (Kogge-Stone) adders everywhere</text>
<text x="560" y="458" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">ALU, branch compare, FETCH2 target, PC incrementers: log2(64) = 6 levels instead of 64</text>
<rect x="36" y="471" width="84" height="18" rx="9" fill="#27AE60" fill-opacity="0.13" stroke="#27AE60"/>
<text x="78" y="483" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#27AE60" text-anchor="middle">done</text>
<text x="134" y="484" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Iterative multiply/divide, split counters</text>
<text x="560" y="484" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">a 64-step divide spread over many cycles instead of one 133 ns cycle</text>
<rect x="36" y="497" width="84" height="18" rx="9" fill="#27AE60" fill-opacity="0.13" stroke="#27AE60"/>
<text x="78" y="509" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#27AE60" text-anchor="middle">done</text>
<text x="134" y="510" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Wallace-tree multiply with carry-save accumulator</text>
<text x="560" y="510" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">18 numbers -&gt; 2 in 6 full-adder levels; one adder at the end sums and negates</text>
<rect x="36" y="523" width="84" height="18" rx="9" fill="#27AE60" fill-opacity="0.13" stroke="#27AE60"/>
<text x="78" y="535" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#27AE60" text-anchor="middle">done</text>
<text x="134" y="536" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Leading-zero counter tree, registered M result</text>
<text x="560" y="536" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">a tree instead of six chained tests; nothing slow in front of forwarding</text>
<rect x="36" y="549" width="84" height="18" rx="9" fill="#27AE60" fill-opacity="0.13" stroke="#27AE60"/>
<text x="78" y="561" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#27AE60" text-anchor="middle">done</text>
<text x="134" y="562" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Decide early, keep FLUSH off register enables</text>
<text x="560" y="562" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">ALU/M controls and ALU operands chosen in DECODE; data registers ignore flushes</text>
<rect x="36" y="575" width="84" height="18" rx="9" fill="#27AE60" fill-opacity="0.13" stroke="#27AE60"/>
<text x="78" y="587" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#27AE60" text-anchor="middle">done</text>
<text x="134" y="588" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Zba + Zbb without slowing the loop</text>
<text x="560" y="588" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">early/late operand paths, adder enters the result mux last, cpop/min/max take 2 cycles</text>
<rect x="36" y="601" width="84" height="18" rx="9" fill="#27AE60" fill-opacity="0.13" stroke="#27AE60"/>
<text x="78" y="613" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#27AE60" text-anchor="middle">done</text>
<text x="134" y="614" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Zbs, cpop over two stages</text>
<text x="560" y="614" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">single-bit decoder only on the early operand path; cpop finishes its count in MEMORY</text>
<rect x="36" y="627" width="84" height="18" rx="9" fill="#8A968E" fill-opacity="0.13" stroke="#8A968E"/>
<text x="78" y="639" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8A968E" text-anchor="middle">next</text>
<text x="134" y="640" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">Split EXECUTE in two (8 stages)</text>
<text x="560" y="640" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">add in EX1, select and forward from EX2: one more bubble per dependence and mispredict</text>
<rect x="36" y="653" width="84" height="18" rx="9" fill="#8A968E" fill-opacity="0.13" stroke="#8A968E"/>
<text x="78" y="665" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8A968E" text-anchor="middle">next</text>
<text x="134" y="666" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">3-stage front end, pipelined caches</text>
<text x="560" y="666" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">BTB, direction, I-cache in separate stages like real cores</text>
<rect x="36" y="679" width="84" height="18" rx="9" fill="#8A968E" fill-opacity="0.13" stroke="#8A968E"/>
<text x="78" y="691" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8A968E" text-anchor="middle">next</text>
<text x="134" y="692" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#17251D" text-anchor="start">15 to 20 stages + out-of-order core</text>
<text x="560" y="692" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">what 4 to 6 GHz desktop cores do: 12 to 20 gate delays per stage, custom circuits</text>

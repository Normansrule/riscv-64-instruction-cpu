<text x="456" y="227" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8A968E" text-anchor="end">limit: a second PC + 4 adder in FETCH2</text>
<text x="456" y="258" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#17251D" text-anchor="end">performance, ASAP7 7 nm, now</text>

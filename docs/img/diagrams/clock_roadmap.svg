<text x="456" y="273" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8A968E" text-anchor="end">limit: divider SIGN step (with the full B extension)</text>
<text x="456" y="304" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#17251D" text-anchor="end">target: 2.5 GHz</text>

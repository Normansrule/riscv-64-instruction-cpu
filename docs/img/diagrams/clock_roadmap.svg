<text x="456" y="181" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8A968E" text-anchor="end">limit: the divider SIGN step (cpop now split over 2 stages)</text>

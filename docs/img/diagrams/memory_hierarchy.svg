<text x="360" y="304" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17251D" text-anchor="middle">main memory  64 KiB</text>
<text x="360" y="322" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4A5A50" text-anchor="middle">Scratchpad_Memory behind a 10-cycle refill port</text>
<rect x="700" y="298" width="96" height="19" rx="9.5" fill="#17A2B8" fill-opacity="0.13" stroke="#17A2B8"/>

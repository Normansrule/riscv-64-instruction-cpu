<text x="30" y="378" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">Every miss is counted: the I and D terms of the CPI stack (docs/MATH.md).</text>

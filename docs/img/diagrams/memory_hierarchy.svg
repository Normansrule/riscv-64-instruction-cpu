<text x="1160" y="244" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4A5A50" text-anchor="middle">8-12 ways, 64 B lines, pipelined</text>

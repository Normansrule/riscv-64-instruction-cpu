<rect x="220" y="124" width="280" height="58" rx="8" fill="none" stroke="#6A5ACD" stroke-width="1.8"/>
<text x="360" y="148" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17251D" text-anchor="middle">registers  31 x 64-bit</text>
<text x="360" y="166" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4A5A50" text-anchor="middle">x1..x31, forwarding into DECODE</text>
<rect x="700" y="142" width="96" height="19" rx="9.5" fill="#6A5ACD" fill-opacity="0.13" stroke="#6A5ACD"/>
<text x="748" y="155" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#6A5ACD" text-anchor="middle">0 cycles</text>
<rect x="180" y="202" width="360" height="58" rx="8" fill="#2E86C1" stroke="#2E86C1" stroke-width="1.5" fill-opacity="0.16"/>
<rect x="180" y="202" width="360" height="58" rx="8" fill="none" stroke="#2E86C1" stroke-width="1.8"/>
<text x="360" y="226" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17251D" text-anchor="middle">L1 I-cache + L1 D-cache  4 KiB each</text>
<text x="360" y="244" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4A5A50" text-anchor="middle">2-way, 32 B lines, LRU, next-line prefetch</text>
<rect x="700" y="220" width="96" height="19" rx="9.5" fill="#2E86C1" fill-opacity="0.13" stroke="#2E86C1"/>

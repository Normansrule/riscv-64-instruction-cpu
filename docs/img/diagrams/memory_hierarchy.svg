<text x="1548" y="389" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#27AE60" text-anchor="middle">40-70 cycles</text>
<rect x="850" y="436" width="620" height="58" rx="8" fill="#E08E0B" stroke="#E08E0B" stroke-width="1.5" fill-opacity="0.16"/>
<rect x="850" y="436" width="620" height="58" rx="8" fill="none" stroke="#E08E0B" stroke-width="1.8"/>
<text x="1160" y="460" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#17251D" text-anchor="middle">DRAM  16-64 GiB</text>

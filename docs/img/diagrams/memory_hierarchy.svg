<rect x="872.4511249783653" y="202" width="575.0977500432693" height="58" rx="8" fill="#2E86C1" stroke="#2E86C1" stroke-width="1.5" fill-opacity="0.16"/>
<rect x="872.4511249783653" y="202" width="575.0977500432693" height="58" rx="8" fill="none" stroke="#2E86C1" stroke-width="1.8"/>

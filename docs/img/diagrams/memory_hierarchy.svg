<text x="830" y="534" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4A5A50" text-anchor="start">Latencies vary by generation; these are typical published figures for recent Intel and AMD cores.</text>

<text x="16" y="374" font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#4A5A50">The 31 x 32-bit register file (flip-flops + read muxes) is the biggest block: registers are expensive in standard cells, which is why real chips use SRAM-style register files.</text></svg>